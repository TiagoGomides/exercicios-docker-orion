version: "3.9"
services:
  db:
    image: mongo:7
    container_name: ex4_mongo_dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongo_data_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "mongodb://localhost:27017", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      target: dev
    container_name: ex4_api_dev
    environment:
      PORT: 3000
      DB_NAME: ${DB_NAME:-blog}
      MONGO_URI: "mongodb://root:root@db:27017/?authSource=admin&directConnection=true"
    ports:
      - "3000:3000"
    volumes:
      - ./api/src:/app/src
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: ["npm","run","dev"]

volumes:
  mongo_data_dev:
