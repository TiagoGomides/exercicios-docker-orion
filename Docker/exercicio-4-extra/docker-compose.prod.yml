name: exercicio-3-prod

services:
  db:
    image: postgres:16-alpine
    container_name: ex3_db
    environment:
      POSTGRES_USER: ${DB_USER:-appuser}
      POSTGRES_PASSWORD: ${DB_PASS:-supersecret}
      POSTGRES_DB: ${DB_NAME:-appdb}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./api/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-appuser} -d ${DB_NAME:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ex3_net
    restart: unless-stopped

  api:
    build:
      context: ./api
      target: prod
    container_name: ex3_api
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    networks:
      - ex3_net
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: ex3_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local.test}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PGADMIN_LISTEN_PORT:-8080}:80"
    networks:
      - ex3_net
    restart: unless-stopped

volumes:
  pgdata:

networks:
  ex3_net:
    name: ex3_net